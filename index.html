<!doctype html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12">
<title>Device Monitor</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{font-family:'DM Sans',sans-serif;background:#080b12}.panel{background:#10151f;border:1px solid #202938}.muted{color:#8b96a8}.screen{aspect-ratio:9/16;max-height:68vh}button:disabled{opacity:.55;cursor:wait}</style>
</head>
<body class="min-h-screen text-slate-100 antialiased">
<header class="sticky top-0 z-30 border-b border-slate-800 bg-[#080b12]/95 backdrop-blur"><div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-4 sm:px-6"><div class="flex items-center gap-3"><div class="rounded-xl bg-blue-500/15 p-2.5 text-blue-400"><i data-lucide="smartphone" class="h-5 w-5"></i></div><div><h1 class="font-semibold tracking-tight">Device Monitor</h1><p class="text-xs muted">Pemantauan perangkat</p></div></div><div class="flex items-center gap-2"><div class="flex items-center gap-2 rounded-lg border border-slate-700 px-3 py-2 text-xs muted"><span id="statusDot" class="h-2 w-2 rounded-full bg-slate-500"></span><span id="statusText">Menghubungkan</span></div><button onclick="toggleConfigModal()" class="rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 hover:bg-slate-800" aria-label="Pengaturan"><i data-lucide="settings-2" class="h-4 w-4"></i></button></div></div></header>
<main class="mx-auto max-w-7xl space-y-5 px-4 py-6 sm:px-6"><div id="connectionError" class="hidden rounded-xl border border-rose-900 bg-rose-950/40 px-4 py-3 text-sm text-rose-200"></div><section class="grid gap-5 lg:grid-cols-[minmax(0,1.45fr)_minmax(320px,.8fr)]"><div class="panel rounded-2xl p-4 sm:p-5"><div class="mb-4 flex flex-wrap items-center justify-between gap-3"><div><h2 class="font-semibold">Tampilan layar</h2><p id="streamUpdateTime" class="mt-1 text-xs muted">Menunggu data perangkat</p></div><button id="toggleStreamBtn" onclick="toggleRemoteStream()" class="flex items-center gap-2 rounded-lg bg-blue-600 px-3.5 py-2.5 text-sm font-medium hover:bg-blue-500"><i data-lucide="play" class="h-4 w-4"></i><span id="toggleStreamText">Mulai stream</span></button></div><div class="flex min-h-[400px] items-center justify-center rounded-xl border border-slate-800 bg-[#080b12] p-4"><div class="screen relative flex w-full max-w-[290px] items-center justify-center overflow-hidden rounded-[28px] border-[5px] border-slate-800 bg-black"><div id="noStreamPlaceholder" class="space-y-3 px-6 text-center"><div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-slate-900 text-slate-500"><i data-lucide="monitor-off" class="h-6 w-6"></i></div><p id="streamPlaceholderTitle" class="text-sm font-medium text-slate-300">Belum ada tampilan</p><p id="streamPlaceholderMessage" class="text-xs leading-5 muted">Hubungkan perangkat, lalu mulai stream.</p></div><img id="liveStreamImage" alt="Tampilan layar perangkat" onclick="handleScreenClick(event)" class="absolute inset-0 hidden h-full w-full cursor-crosshair object-contain"></div></div><div class="mt-4 flex flex-wrap justify-between gap-3"><div class="flex gap-2"><button onclick="sendRemoteAction('back')" class="flex items-center gap-2 rounded-lg border border-slate-700 px-3 py-2 text-sm hover:bg-slate-800"><i data-lucide="arrow-left" class="h-4 w-4 text-blue-400"></i>Back</button><button onclick="sendRemoteAction('home')" class="flex items-center gap-2 rounded-lg border border-slate-700 px-3 py-2 text-sm hover:bg-slate-800"><i data-lucide="house" class="h-4 w-4 text-emerald-400"></i>Home</button></div><button onclick="zoomScreen()" class="flex items-center gap-2 rounded-lg border border-slate-700 px-3 py-2 text-sm hover:bg-slate-800"><i data-lucide="maximize-2" class="h-4 w-4"></i>Perbesar</button></div></div><aside class="space-y-4"><div class="flex items-end justify-between"><div><h2 class="font-semibold">Perangkat</h2><p class="mt-1 text-xs muted">Status dan aktivitas terbaru</p></div><span id="deviceCount" class="rounded-lg border border-slate-700 px-2.5 py-1.5 text-xs muted">0 perangkat</span></div><div id="devicesGrid" class="space-y-3"><div class="panel rounded-xl p-6 text-center text-sm muted">Memuat data perangkat…</div></div></aside></section></main>
<div id="zoomModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/90 p-4" onclick="zoomScreen()"><button class="absolute right-5 top-5 rounded-lg bg-slate-800 p-2" aria-label="Tutup"><i data-lucide="x" class="h-5 w-5"></i></button><img id="zoomedImage" alt="Tampilan layar diperbesar" class="max-h-[88vh] max-w-full object-contain"></div>
<div id="configModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/75 p-4"><div class="panel w-full max-w-md rounded-2xl p-5"><div class="mb-5 flex items-center justify-between"><h2 class="font-semibold">Koneksi Supabase</h2><button onclick="toggleConfigModal()" aria-label="Tutup"><i data-lucide="x" class="h-5 w-5"></i></button></div><form onsubmit="saveConfig(event)" class="space-y-4"><label class="block text-xs font-medium text-slate-300">Project URL<input id="inputUrl" type="url" required class="mt-2 w-full rounded-lg border border-slate-700 bg-[#080b12] px-3 py-2.5 text-sm outline-none focus:border-blue-500"></label><label class="block text-xs font-medium text-slate-300">Anon / publishable key<input id="inputKey" type="password" required class="mt-2 w-full rounded-lg border border-slate-700 bg-[#080b12] px-3 py-2.5 text-sm outline-none focus:border-blue-500"></label><p class="text-xs leading-5 muted">Jangan masukkan service_role key di browser.</p><div class="flex gap-2"><button type="button" onclick="toggleConfigModal()" class="w-1/2 rounded-lg border border-slate-700 py-2.5 text-sm hover:bg-slate-800">Batal</button><button class="w-1/2 rounded-lg bg-blue-600 py-2.5 text-sm font-medium hover:bg-blue-500">Simpan dan hubungkan</button></div></form></div></div>
<script>
const DEFAULT_SUPABASE_URL='https://cgsfrzorhbuerwirfmzf.supabase.co';
const DEFAULT_SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnc2Zyem9yaGJ1ZXJ3aXJmbXpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4MjM5MTMsImV4cCI6MjEwOTM5OTkxM30.tjOOuNnDU7vaJGt7Lh9630f8UnNGW_sLO81H3p_ONXg';
let supabaseClient=null,devicesData={},activeDeviceId=null,isStreamActive=false,realtimeChannel=null;
document.addEventListener('DOMContentLoaded',()=>{lucide.createIcons();loadConfig()});
function toggleConfigModal(){const el=document.getElementById('configModal');el.classList.toggle('hidden');el.classList.toggle('flex')}
function setState(state,message=''){const style={connected:['bg-emerald-400','Terhubung'],connecting:['bg-amber-400 animate-pulse','Menghubungkan'],error:['bg-rose-400','Koneksi gagal']}[state];document.getElementById('statusDot').className='h-2 w-2 rounded-full '+style[0];document.getElementById('statusText').textContent=style[1];const box=document.getElementById('connectionError');box.textContent=message;box.classList.toggle('hidden',!message)}
function normalizeUrl(url){return url.trim().replace(/\/rest\/v1\/?$/,'').replace(/\/$/,'')}
function loadConfig(){const url=localStorage.getItem('supabase_url')||DEFAULT_SUPABASE_URL,key=localStorage.getItem('supabase_anon_key')||DEFAULT_SUPABASE_KEY;document.getElementById('inputUrl').value=url;document.getElementById('inputKey').value=key;initSupabase(url,key)}
function saveConfig(event){event.preventDefault();const url=normalizeUrl(document.getElementById('inputUrl').value),key=document.getElementById('inputKey').value.trim();localStorage.setItem('supabase_url',url);localStorage.setItem('supabase_anon_key',key);toggleConfigModal();initSupabase(url,key)}
async function initSupabase(url,key){if(realtimeChannel&&supabaseClient)await supabaseClient.removeChannel(realtimeChannel);devicesData={};activeDeviceId=null;setState('connecting');try{supabaseClient=supabase.createClient(normalizeUrl(url),key);const{data,error}=await supabaseClient.from('devices').select('*').order('last_updated',{ascending:false});if(error)throw error;data.forEach(d=>devicesData[d.id]=d);renderDevices();setState('connected');subscribeRealtime()}catch(e){console.error('Supabase:',e);setState('error','Gagal membaca tabel devices: '+(e.message||'periksa URL, key, tabel, dan policy RLS.'));renderDevices()}}
function subscribeRealtime(){realtimeChannel=supabaseClient.channel('devices-changes').on('postgres_changes',{event:'*',schema:'public',table:'devices'},p=>{const row=p.new?.id?p.new:p.old;if(!row?.id)return;if(p.eventType==='DELETE')delete devicesData[row.id];else devicesData[row.id]=row;renderDevices()}).subscribe(s=>{if(s==='CHANNEL_ERROR'||s==='TIMED_OUT')console.error('Realtime:',s)})}
function renderDevices(){const grid=document.getElementById('devicesGrid'),devices=Object.values(devicesData).sort((a,b)=>new Date(b.last_updated||0)-new Date(a.last_updated||0));document.getElementById('deviceCount').textContent=devices.length+' perangkat';if(!devices.length){activeDeviceId=null;grid.innerHTML='<div class="panel rounded-xl px-5 py-10 text-center"><i data-lucide="smartphone" class="mx-auto mb-3 h-8 w-8 text-slate-600"></i><p class="text-sm text-slate-300">Belum ada perangkat</p><p class="mt-1 text-xs muted">Pastikan aplikasi Android berhasil mengirim data.</p></div>';updateStreamView(null);lucide.createIcons();return}if(!devices.some(d=>d.id===activeDeviceId))activeDeviceId=devices[0].id;const active=devices.find(d=>d.id===activeDeviceId);isStreamActive=!!active.is_mirroring_enabled;updateStreamButton();updateStreamView(active);grid.innerHTML=devices.map(d=>{const online=isOnline(d.last_updated),battery=Number(d.battery_level)>=0?escapeHtml(d.battery_level)+'%':'—';return '<button onclick="selectDevice('+JSON.stringify(d.id)+')" class="panel block w-full rounded-xl p-4 text-left transition hover:border-slate-600 '+(d.id===activeDeviceId?'border-blue-500/60':'')+'"><div class="mb-3 flex items-start justify-between gap-2"><div class="flex items-center gap-3"><span class="rounded-lg bg-slate-800 p-2 text-blue-300"><i data-lucide="smartphone" class="h-4 w-4"></i></span><div><p class="text-sm font-semibold">'+escapeHtml(d.device_name||d.id)+'</p><p class="mt-0.5 text-xs muted">'+escapeHtml(d.model||'Model tidak diketahui')+'</p></div></div><span class="rounded-full px-2 py-1 text-[10px] '+(online?'bg-emerald-500/10 text-emerald-300':'bg-slate-800 text-slate-400')+'">'+(online?'ONLINE':'OFFLINE')+'</span></div><div class="mt-3 border-t border-slate-800 pt-3" onclick="event.stopPropagation()"><label class="mb-1 block text-xs muted">Buka aplikasi di HP</label><div class="flex gap-2"><select id="app-select-'+escapeHtml(d.id)+'" class="min-w-0 flex-1 rounded-lg border border-slate-700 bg-[#080b12] px-2.5 py-2 text-xs text-slate-200"><option value="">Pilih aplikasi…</option>'+renderAppOptions(d.installed_apps)+'</select><button onclick="openInstalledApp(\''+escapeHtml(d.id)+'\')" class="rounded-lg bg-blue-600 px-3 py-2 text-xs font-medium hover:bg-blue-500">Buka</button></div></div><div class="grid grid-cols-2 gap-2 border-t border-slate-800 pt-3 text-xs"><span class="muted">Baterai</span><span class="text-right">'+battery+(d.is_charging?' · Mengisi':'')+'</span><span class="muted">Jaringan</span><span class="text-right">'+escapeHtml(d.network_type||'—')+'</span><span class="muted">Aplikasi aktif</span><span class="truncate text-right">'+escapeHtml(d.current_app_name||'—')+'</span><span class="muted">Update</span><span class="text-right">'+formatDate(d.last_updated)+'</span></div></button>'}).join('');lucide.createIcons()}
function selectDevice(id){activeDeviceId=id;renderDevices()}
function renderAppOptions(value){let apps=[];try{apps=Array.isArray(value)?value:JSON.parse(value||'[]')}catch(e){return '<option value="">Daftar aplikasi belum tersedia</option>'}return apps.map(app=>'<option value="'+escapeHtml(app.package)+'">'+escapeHtml(app.label||app.package)+'</option>').join('')||'<option value="">Daftar aplikasi kosong</option>'}
async function openInstalledApp(deviceId){const select=document.getElementById('app-select-'+deviceId),packageName=select?.value;if(!packageName){setState('error','Pilih aplikasi terlebih dahulu.');return}activeDeviceId=deviceId;await updateDevice({remote_action:'open:'+packageName,remote_action_id:'action_'+Date.now()})}
function updateStreamView(d){const img=document.getElementById('liveStreamImage'),ph=document.getElementById('noStreamPlaceholder');if(d&&isStreamActive&&d.screen_image){img.src=d.screen_image;img.classList.remove('hidden');ph.classList.add('hidden');document.getElementById('streamUpdateTime').textContent='Terakhir diterima '+formatDate(d.last_updated)}else{img.classList.add('hidden');ph.classList.remove('hidden');document.getElementById('streamPlaceholderTitle').textContent=d&&isStreamActive?'Menunggu tangkapan layar':'Stream sedang mati';document.getElementById('streamPlaceholderMessage').textContent=d&&isStreamActive?'Menunggu gambar dari aplikasi Android.':'Pilih perangkat lalu mulai stream.';document.getElementById('streamUpdateTime').textContent=d?'Data perangkat '+formatDate(d.last_updated):'Menunggu data perangkat'}}
function updateStreamButton(){const b=document.getElementById('toggleStreamBtn');b.className='flex items-center gap-2 rounded-lg px-3.5 py-2.5 text-sm font-medium '+(isStreamActive?'bg-rose-600 hover:bg-rose-500':'bg-blue-600 hover:bg-blue-500');document.getElementById('toggleStreamText').textContent=isStreamActive?'Matikan stream':'Mulai stream'}
function requireDevice(){if(!supabaseClient||!activeDeviceId){setState('error','Belum ada perangkat yang bisa dipilih.');return false}return true}
async function updateDevice(values){const{error}=await supabaseClient.from('devices').update(values).eq('id',activeDeviceId);if(error){setState('error','Gagal mengirim perintah: '+error.message);return}if(values.is_mirroring_enabled!==undefined)isStreamActive=values.is_mirroring_enabled;setState('connected');updateStreamButton()}
async function toggleRemoteStream(){if(requireDevice())await updateDevice({is_mirroring_enabled:!isStreamActive})}
async function sendRemoteAction(action){if(requireDevice())await updateDevice({remote_action:action,remote_action_id:'action_'+Date.now()})}
async function handleScreenClick(e){if(!requireDevice())return;const r=e.currentTarget.getBoundingClientRect(),d=devicesData[activeDeviceId]||{},x=Math.round((e.clientX-r.left)/r.width*(d.screen_width||1080)),y=Math.round((e.clientY-r.top)/r.height*(d.screen_height||2340));await updateDevice({remote_action:'tap:'+x+','+y,remote_action_id:'action_'+Date.now()})}
function zoomScreen(){const m=document.getElementById('zoomModal'),i=document.getElementById('liveStreamImage');if(!i.classList.contains('hidden')&&i.src){document.getElementById('zoomedImage').src=i.src;m.classList.toggle('hidden');m.classList.toggle('flex')}}
function isOnline(v){return v&&Date.now()-new Date(v).getTime()<180000}function formatDate(v){return v?new Date(v).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'}):'—'}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
